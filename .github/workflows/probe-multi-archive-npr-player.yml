name: Probe Multiple Web Archives

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe-archives:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Probe Wayback and Arquivo.pt
        run: python probe_multi_archive_npr_player.py

      - name: Save archive probe report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_multi_archive_player_probe.json
          git diff --cached --quiet || git commit -m "Probe web archives for NPR player audio"
          git push
