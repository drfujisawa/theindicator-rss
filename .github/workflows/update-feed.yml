name: Update The Indicator RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Update RSS feed
        run: python theindicator_rss.py

      - name: Validate updated feed
        run: python scripts/validate_feed_integrity.py --baseline-ref HEAD

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theindicator_feed.xml
          git diff --cached --quiet || git commit -m "Update The Indicator RSS feed"
          git push
