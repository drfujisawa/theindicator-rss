name: Inspect Neighboring NPR Filenames

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-neighbors:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Inspect neighboring NPR filenames
        run: python inspect_neighboring_npr_filenames.py

      - name: Save neighboring filename report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_npr_filename_neighbors.json
          git diff --cached --quiet || git commit -m "Inspect neighboring NPR audio filenames"
          git push
