name: Probe Wayback NPR Audio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe-wayback:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Probe archived NPR pages
        run: python probe_wayback_npr_audio.py

      - name: Save Wayback probe report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_wayback_npr_probe.json
          git diff --cached --quiet || git commit -m "Probe archived NPR pages for audio"
          git push
