name: Probe WBUR Traffic Tariff

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe-wbur:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Probe WBUR Traffic Tariff audio
        run: python probe_wbur_traffic_tariff.py

      - name: Save WBUR probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_wbur_traffic_tariff_probe.json
          git diff --cached --quiet || git commit -m "Probe WBUR for Traffic Tariff audio"
          git push
