name: Recover Missing Indicator Episodes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-missing:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Recover missing Indicator episodes
        run: python recover_missing_episodes.py

      - name: Save recovered episodes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_recovered_episodes.json
          git diff --cached --quiet || git commit -m "Recover early Indicator episodes"
          git push
