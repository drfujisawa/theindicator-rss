name: Probe Fresh Identity Discovery

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fresh-identity-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run unit tests
        run: python -m unittest test_fresh_identity_discovery -v

      - name: Run fresh identity discovery probe
        run: python probe_fresh_identity_discovery.py

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-identity-discovery-diagnostics
          path: |
            fresh_identity_discovery_*_diag.json
            fresh_identity_discovery_summary.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit diagnostic JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fresh_identity_discovery_*_diag.json fresh_identity_discovery_summary.json
          git diff --cached --quiet || git commit -m "Fresh identity discovery diagnostics"
          git push
