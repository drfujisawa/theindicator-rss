name: Analyze NPR Redirect Mapping

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-redirect-mapping:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Analyze NPR redirect mapping
        run: python analyze_npr_redirect_mapping.py

      - name: Save redirect mapping report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_npr_redirect_mapping.json
          git diff --cached --quiet || git commit -m "Analyze NPR redirect ID mapping"
          git push
