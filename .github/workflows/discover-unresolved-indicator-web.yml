name: Discover Unresolved Indicator Episodes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover-unresolved:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Discover unresolved episodes on the web
        run: python discover_unresolved_indicator_web.py

      - name: Save discovery report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_unresolved_web_discovery.json
          git diff --cached --quiet || git commit -m "Discover unresolved Indicator episodes"
          git push
