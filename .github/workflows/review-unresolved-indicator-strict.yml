name: Review Unresolved Indicator Strictly

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  strict-review:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Strictly review unresolved evidence
        run: python recover_unresolved_indicator_strict.py

      - name: Save strict review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_unresolved_strict_review.json
          git diff --cached --quiet || git commit -m "Strictly review unresolved Indicator evidence"
          git push
