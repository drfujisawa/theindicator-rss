name: Test Indicator History

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-history:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Run historical crawler
        run: python theindicator_history.py

      - name: Save historical progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_history.json
          git diff --cached --quiet || git commit -m "Update Indicator historical archive"
          git push
