name: Probe NPR Identity

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe-npr:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Probe affiliate page for NPR identity
        run: python probe_npr_identity.py

      - name: Save NPR identity report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_npr_identity_probe.json
          git diff --cached --quiet || git commit -m "Probe recovered episode for NPR identity"
          git push
