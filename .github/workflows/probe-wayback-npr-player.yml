name: Probe Wayback NPR Player

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe-wayback-player:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Probe archived NPR player pages
        run: python probe_wayback_npr_player.py

      - name: Save Wayback player probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_wayback_player_probe.json
          git diff --cached --quiet || git commit -m "Probe archived NPR players for audio"
          git push
