name: Recover NPR Audio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-npr-audio:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Recover audio from original NPR pages
        run: python recover_npr_audio.py

      - name: Save NPR audio recovery report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_npr_audio_recovery.json
          git diff --cached --quiet || git commit -m "Recover original NPR audio metadata"
          git push
