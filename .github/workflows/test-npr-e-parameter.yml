name: Test NPR E Parameter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-e-parameter:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Test NPR e parameter
        run: python test_npr_e_parameter.py

      - name: Save test report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_npr_e_parameter_test.json
          git diff --cached --quiet || git commit -m "Test NPR audio e parameter"
          git push
