name: Recover Indicator Episodes Via Affiliates

on:
  workflow_dispatch:
    inputs:
      start_index:
        description: "Starting episode index"
        required: true
        default: "0"
      batch_size:
        description: "Number of episodes to process"
        required: true
        default: "10"

permissions:
  contents: write

jobs:
  affiliate-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      START_INDEX: ${{ inputs.start_index }}
      BATCH_SIZE: ${{ inputs.batch_size }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Search verified affiliate pages
        run: python recover_unresolved_indicator_affiliates.py

      - name: Save affiliate recovery report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_unresolved_affiliate_recovery_*.json
          git diff --cached --quiet || git commit -m "Recover unresolved Indicator episodes via affiliates"
          git push
