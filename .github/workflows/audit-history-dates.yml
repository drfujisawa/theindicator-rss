name: Audit Indicator History Dates

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-history-dates:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run date audit
        run: python audit_history_dates.py

      - name: Save audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_history_date_audit.json
          git diff --cached --quiet || git commit -m "Audit Indicator history dates"
          git push
