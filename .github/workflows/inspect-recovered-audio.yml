name: Inspect Recovered Indicator Audio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-audio:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Inspect recovered audio metadata
        run: python inspect_recovered_audio.py

      - name: Save inspection report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_audio_inspection.json
          git diff --cached --quiet || git commit -m "Inspect recovered Indicator audio metadata"
          git push
