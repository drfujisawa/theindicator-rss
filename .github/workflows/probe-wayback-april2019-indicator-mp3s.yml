name: Probe Wayback April 2019 Indicator MP3s

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe-april2019:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Enumerate April 2019 Indicator MP3s
        run: python probe_wayback_april2019_indicator_mp3s.py

      - name: Save April 2019 MP3 report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_april2019_wayback_mp3s.json
          git diff --cached --quiet || git commit -m "Enumerate archived April 2019 Indicator audio"
          git push
