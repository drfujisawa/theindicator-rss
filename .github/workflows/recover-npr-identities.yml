name: Recover NPR Identities

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-npr-identities:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Recover original NPR identities
        run: python recover_npr_identities.py

      - name: Save NPR identity audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_npr_identities.json
          git diff --cached --quiet || git commit -m "Recover original NPR episode identities"
          git push
