name: Inspect NPR Audio Review

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-review:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Extract records needing review
        run: python inspect_npr_audio_review.py

      - name: Save review report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_npr_audio_review.json
          git diff --cached --quiet || git commit -m "Inspect NPR audio review records"
          git push
