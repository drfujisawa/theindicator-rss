name: Recover No-Audio Targets

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Batch number to process (1-based; batch 1 = targets 1–5, batch 2 = 6–10, …)"
        required: false
        default: "1"
      batch_size:
        description: "Targets per batch (default 5; ceil(21/5) = 5 runs for full coverage)"
        required: false
        default: "5"
      commit_results:
        description: "Commit generated JSON artifacts back to the branch (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  recover-no-audio-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run no-audio target recovery (batch ${{ github.event.inputs.batch || '1' }})
        run: |
          python scripts/recovery/recover_no_audio_targets.py \
            --output-dir data/recovery/no_audio_targets \
            --batch ${{ github.event.inputs.batch || '1' }} \
            --batch-size ${{ github.event.inputs.batch_size || '5' }}

      - name: Upload no-audio recovery artifacts (batch ${{ github.event.inputs.batch || '1' }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: no-audio-batch-${{ github.event.inputs.batch || '1' }}
          path: data/recovery/no_audio_targets/*.json
          retention-days: 90

      - name: Commit result artifacts
        if: success() && github.event.inputs.commit_results == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recovery/no_audio_targets/*.json
          if git diff --cached --quiet; then
            echo "No artifact JSON changes to commit."
          else
            git commit -m "chore: update no-audio recovery artifacts from Actions run (batch ${{ github.event.inputs.batch || '1' }})"
            git push
          fi
