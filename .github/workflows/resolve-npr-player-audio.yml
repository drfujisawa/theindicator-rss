name: Resolve NPR Player Audio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-player-audio:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Resolve NPR player audio
        run: python resolve_npr_player_audio.py

      - name: Save player resolution report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_npr_player_resolution.json
          git diff --cached --quiet || git commit -m "Resolve NPR player audio"
          git push
