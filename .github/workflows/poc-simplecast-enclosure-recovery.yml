name: POC Simplecast Enclosure Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - copilot/analyze-indicator-feed-and-history
    paths:
      - poc_simplecast_enclosure_recovery.py
      - .github/workflows/poc-simplecast-enclosure-recovery.yml

permissions:
  contents: write

jobs:
  poc-simplecast-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run POC Simplecast enclosure recovery
        run: python poc_simplecast_enclosure_recovery.py

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-simplecast-results
          path: poc_simplecast_results.json
          retention-days: 30

      - name: Commit results back to branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add poc_simplecast_results.json
          if git diff --cached --quiet; then
            echo "No changes to poc_simplecast_results.json — skipping commit."
          else
            git commit -m "chore: update poc_simplecast_results.json from Actions run"
            git push
          fi
