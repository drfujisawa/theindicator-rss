name: Probe NPR Legacy Feed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe-legacy-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Probe NPR legacy feeds
        run: python probe_npr_legacy_feed.py

      - name: Save legacy feed probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_npr_legacy_feed_probe.json
          git diff --cached --quiet || git commit -m "Probe NPR legacy Indicator feeds"
          git push
