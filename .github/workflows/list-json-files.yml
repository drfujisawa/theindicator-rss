name: List JSON Files

on:
  workflow_dispatch:

jobs:
  list-json-files:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: List JSON files in repo root
        run: |
          echo "JSON files in repository root:"
          echo
          ls -1 *.json || true

      - name: Probe NPR MP3 headers
        run: |
          URL="https://ondemand.npr.org/anon.npr-mp3/npr/indicator/2018/04/20180426_indicator_sb_827_raw_tape_final.mp3"
          echo "URL: ${URL}"
          curl -sSIL "$URL" | sed -n '1,20p'
