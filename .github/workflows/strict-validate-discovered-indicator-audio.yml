name: Strict Validate Discovered Indicator Audio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  strict-validate-audio:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Strictly validate discovered audio
        run: python strict_validate_discovered_indicator_audio.py

      - name: Save strict validation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_unresolved_web_audio_strict_validation.json
          git diff --cached --quiet || git commit -m "Strictly validate discovered Indicator audio"
          git push
