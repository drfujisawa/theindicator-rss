name: Recover NPR Story Found Indicator Episodes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-npr-story-found:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Recover NPR story episodes
        run: python recover_npr_story_found_indicator.py

      - name: Save NPR story recovery report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_npr_story_found_recovery.json
          git diff --cached --quiet || git commit -m "Recover NPR story-found Indicator episodes"
          git push
