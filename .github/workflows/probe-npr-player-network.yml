name: Probe NPR Player Network (Headless Browser Experiment)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-npr-player-network:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run NPR player network probe
        run: python scripts/recovery/probe_npr_player_network.py

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npr-player-network-probe
          path: data/recovery/npr_player_network_probe.json
          retention-days: 90
