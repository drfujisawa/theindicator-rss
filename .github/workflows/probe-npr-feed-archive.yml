name: Probe NPR Feed Archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe-npr-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Probe official NPR Indicator feed
        run: python probe_npr_feed_archive.py

      - name: Save NPR feed probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_npr_feed_probe.json
          git diff --cached --quiet || git commit -m "Probe NPR Indicator feed for historical audio"
          git push
