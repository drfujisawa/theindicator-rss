name: Validate Recovered Indicator Episodes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-recovered:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate recovered episodes
        run: python validate_recovered_episodes.py

      - name: Save validation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_recovery_validation.json
          git diff --cached --quiet || git commit -m "Validate recovered Indicator episodes"
          git push
