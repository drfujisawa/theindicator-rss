name: Analyze NPR Filename Slugs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-slugs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Analyze NPR filename slugs
        run: python analyze_npr_filename_slugs.py

      - name: Save filename slug analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_npr_filename_slug_analysis.json
          git diff --cached --quiet || git commit -m "Analyze NPR Indicator filename slugs"
          git push
