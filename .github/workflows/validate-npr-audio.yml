name: Validate NPR Audio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-npr-audio:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate recovered NPR audio
        run: python validate_npr_audio.py

      - name: Save NPR audio validation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_npr_audio_validation.json
          git diff --cached --quiet || git commit -m "Validate recovered NPR audio"
          git push
