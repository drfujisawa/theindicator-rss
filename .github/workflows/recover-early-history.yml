name: Recover Early Indicator History

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-early-history:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run early-history recovery test
        run: python indicator_early_history.py

      - name: Save early-history results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_early_history.json
          git diff --cached --quiet || git commit -m "Test early Indicator history recovery"
          git push
