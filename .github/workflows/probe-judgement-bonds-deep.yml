name: Probe Judgement Bonds Deeply

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  judgement-bonds-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Probe Judgement Bonds
        run: python probe_judgement_bonds_deep.py

      - name: Save Judgement Bonds report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_judgement_bonds_probe.json
          git diff --cached --quiet || git commit -m "Deep probe Judgement Bonds recovery"
          git push
